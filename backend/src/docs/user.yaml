paths:
  /users:
    get:
      summary: /users
      description: Retrieves the authenticated user's data.
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user's data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized.

  /users/{id}:
    get:
      summary: /users/{id}
      description: Retrieves a user's data by their UUID.
      tags:
        - User
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The user's UUID.
      responses:
        '200':
          description: The user data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found.

    put:
      summary: /users/{id}
      description: Updates a user's data by their UUID.
      tags:
        - User
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The user's UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: User updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid update data.
        '404':
          description: User not found.

    delete:
      summary: /users/{id}
      description: Deletes a user by their UUID.
      tags:
        - User
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The user's UUID.
      responses:
        '204':
          description: User deleted successfully.
        '404':
          description: User not found.

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
      example:
        id: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        name: "John Doe"
        email: "johndoe@example.com"