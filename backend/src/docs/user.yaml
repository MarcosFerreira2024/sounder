paths:
  /user/me:
    get:
      summary: Get authenticated user's full information
      description: Retrieves all information about the authenticated user.
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The authenticated user's full data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User" # Assuming User schema contains all fields
        "401":
          description: Unauthorized.

  /user/{userId}:
    get:
      summary: Get public user information by ID
      description: Retrieves public information about a user by their ID.
      tags:
        - User
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the user to retrieve public information for.
      responses:
        "200":
          description: The user's public data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User" # Using User schema for now, might need a PublicUser schema if fields are filtered
        "404":
          description: User not found.

    put:
      summary: Update user by ID
      description: Updates a user's data by their UUID.
      tags:
        - User
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
          description: The user's UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: User updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid update data.
        "404":
          description: User not found.

    delete:
      summary: Delete user by ID
      description: Deletes a user by their UUID.
      tags:
        - User
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
          description: The user's UUID.
      responses:
        "204":
          description: User deleted successfully.
        "404":
          description: User not found.

  /user/profilePicture:
    post:
      summary: Update user profile picture
      description: Updates a user's profile picture.
      tags:
        - User
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                userId:
                  type: string
                  format: uuid

      responses:
        "200":
          description: User photo updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request.
        "401":
          description: Unauthorized.

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
      example:
        id: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        name: "John Doe"
        email: "johndoe@example.com"
