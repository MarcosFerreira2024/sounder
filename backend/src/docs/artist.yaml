paths:
  /artists:
    get:
      summary: Get all artists
      description: Retrieve a list of all artists with optional pagination and search filters.
      tags:
        - Artist
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination.
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of artists per page.
        - in: query
          name: name
          schema:
            type: string
          description: Search artists by name.
        - in: query
          name: id
          schema:
            type: string
            format: uuid
          description: Search artists by ID.
        - in: query
          name: musicName
          schema:
            type: string
          description: Search artists by music name.
        - in: query
          name: albumName
          schema:
            type: string
          description: Search artists by album name.
      responses:
        "200":
          description: A list of artists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Artist"
                  message:
                    type: string
                    example: "Artists fetched successfully"
        "401":
          description: Unauthorized.
        "500":
          description: Internal Server Error.

  /artists/assign/{userId}:
    post:
      summary: Assign user as artist
      description: Assigns a specified user as an artist. Only accessible by administrators.
      tags:
        - Artist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
          description: The UUID of the user to be assigned as an artist.
      responses:
        "201":
          description: Artist assigned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Artist Assigned successfully"
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden (user does not have permissions).
        "404":
          description: User not found.
        "500":
          description: Internal Server Error.

components:
  schemas:
    Artist:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the artist.
        name:
          type: string
          description: The name of the artist.
      example:
        id: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        name: "Example Artist"
