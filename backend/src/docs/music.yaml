paths:
  /music:
    get:
      summary: Get all musics
      description: Retrieves a list of all musics.
      tags:
        - Music
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination.
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page for pagination.
        - in: query
          name: name
          schema:
            type: string
          description: Filter musics by name.
        - in: query
          name: audio
          schema:
            type: string
          description: Filter musics by audio file name.
        - in: query
          name: id
          schema:
            type: string
            format: uuid
          description: Filter musics by ID.
        - in: query
          name: authorId
          schema:
            type: string
            format: uuid
          description: Filter musics by author ID.
        - in: query
          name: authorName
          schema:
            type: string
          description: Filter musics by author name.
      responses:
        '200':
          description: A list of musics.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Music'
        '401':
          description: Unauthorized.

    post:
      summary: Create a new music
      description: Creates a new music entry, accepting an optional LRC lyrics file.
      tags:
        - Music
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - albumId
                - genres
              properties:
                name:
                  type: string
                  example: "New Song"
                albumId:
                  type: string
                  format: uuid
                  example: "c3d4e5f6-a7b8-9012-3456-7890abcdef01"
                genres:
                  type: array
                  items:
                    type: string
                  example: ["Rock", "Pop"]
                artistId:
                  type: string
                  format: uuid
                  description: Optional artist ID if user is admin.
                lyricsFile:
                  type: string
                  format: binary
                  description: LRC lyrics file.
      responses:
        '201':
          description: Music created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Music'
        '400':
          description: Invalid input.
        '401':
          description: Unauthorized.

    CreateMusicInput:
      type: object
      required:
        - name
        - albumId
        - genres
      properties:
        name:
          type: string
          example: "New Song"
        albumId:
          type: string
          format: uuid
          example: "c3d4e5f6-a7b8-9012-3456-7890abcdef01"
        genres:
          type: array
          items:
            type: string
          example: ["Rock", "Pop"]
        lyricsFile:
          type: string
          format: binary
          description: LRC lyrics file.
        artistId:
          type: string
          format: uuid
          description: Optional artist ID if user is admin.

  /music/{id}:
    get:
      summary: Get music by ID
      description: Retrieves a single music entry by its ID.
      tags:
        - Music
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The music's UUID.
      responses:
        '200':
          description: Music data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Music'
        '404':
          description: Music not found.
        '401':
          description: Unauthorized.

    put:
      summary: Update a music by ID
      description: Updates an existing music entry by its ID.
      tags:
        - Music
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The music's UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMusicInput'
      responses:
        '200':
          description: Music updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Music'
        '400':
          description: Invalid input.
        '404':
          description: Music not found.
        '401':
          description: Unauthorized.

    delete:
      summary: Delete a music by ID
      description: Deletes a music entry by its ID.
      tags:
        - Music
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The music's UUID.
      responses:
        '204':
          description: Music deleted successfully.
        '404':
          description: Music not found.
        '401':
          description: Unauthorized.

  /music/with-album:
    post:
      summary: Create music with album
      description: Creates a new music entry and associates it with an album.
      tags:
        - Music
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMusicWithAlbumInput'
      responses:
        '201':
          description: Music and album created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Music'
        '400':
          description: Invalid input.
        '401':
          description: Unauthorized.

  /music/{id}/like:
    post:
      summary: Like a music
      description: Records a user's like action for a specific music.
      tags:
        - Music
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The music's UUID.
      responses:
        '200':
          description: Music liked successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicAction'
        '404':
          description: Music not found.
        '401':
          description: Unauthorized.

  /music/{id}/deslike:
    post:
      summary: Deslike a music
      description: Records a user's deslike action for a specific music.
      tags:
        - Music
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The music's UUID.
      responses:
        '200':
          description: Music desliked successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicAction'
        '404':
          description: Music not found.
        '401':
          description: Unauthorized.

  /music/album:
    put:
      summary: Assign music to an album
      description: Associates a music track with an album.
      tags:
        - Music
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - musicId
                - albumId
              properties:
                musicId:
                  type: string
                  format: uuid
                  description: The ID of the music to be assigned.
                albumId:
                  type: string
                  format: uuid
                  description: The ID of the album to which the music will be assigned.
                artistId:
                  type: string
                  format: uuid
                  description: The ID of the artist, if the user is an admin.
      responses:
        '200':
          description: Music successfully assigned to the album.
        '400':
          description: Invalid input.
        '401':
          description: Unauthorized.
        '404':
          description: Music or album not found.

components:
  schemas:
    Music:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        name:
          type: string
          example: "My Awesome Song"
        authorId:
          type: string
          format: uuid
          example: "b2c3d4e5-f6a7-8901-2345-67890abcdef0"
        audio:
          type: string
          example: "https://example.com/audio/mysong.mp3"
        albumId:
          type: string
          format: uuid
          example: "c3d4e5f6-a7b8-9012-3456-7890abcdef01"
        likeCount:
          type: integer
          example: 123
        lyrics:
          type: string
          example: "These are the lyrics to my awesome song."

    CreateMusicInput:
      type: object
      required:
        - name
        - audio
        - albumId
        - genres
        - lyrics
      properties:
        name:
          type: string
          example: "New Song"
        audio:
          type: string
          example: "https://example.com/audio/newsong.mp3"
        albumId:
          type: string
          format: uuid
          example: "c3d4e5f6-a7b8-9012-3456-7890abcdef01"
        genres:
          type: array
          items:
            type: string
          example: ["Rock", "Pop"]
        lyrics:
          type: string
          example: "These are the lyrics of the new song."

    UpdateMusicInput:
      type: object
      properties:
        name:
          type: string
          example: "Updated Song Title"
        audio:
          type: string
          example: "https://example.com/audio/updatedsong.mp3"
        albumId:
          type: string
          format: uuid
          example: "c3d4e5f6-a7b8-9012-3456-7890abcdef01"
        genres:
          type: array
          items:
            type: string
          example: ["Jazz", "Blues"]

    CreateMusicWithAlbumInput:
      type: object
      required:
        - musicName
        - audio
        - albumName
        - genres
        - lyrics
        - albumCover
      properties:
        musicName:
          type: string
          example: "Song with new Album"
        audio:
          type: string
          example: "https://example.com/audio/songwithnewalbum.mp3"
        albumName:
          type: string
          example: "My New Album"
        lyrics:
          type: string
          example: "Lyrics for the song with new album."
        albumCover:
          type: string
          example: "https://example.com/album/cover.jpg"
        genres:
          type: array
          items:
            type: string
          example: ["Classical", "Electronic"]

    MusicAction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        userId:
          type: string
          format: uuid
          example: "b2c3d4e5-f6a7-8901-2345-67890abcdef0"
        musicId:
          type: string
          format: uuid
          example: "c3d4e5f6-a7b8-9012-3456-7890abcdef01"
        viewed:
          type: boolean
          example: true
        reaction:
          type: string
          enum: [LIKE, DISLIKE, NONE]
          example: "LIKE"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-27T12:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-27T12:00:00Z"
