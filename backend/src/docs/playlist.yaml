paths:
  /users/{userId}/playlists:
    get:
      summary: /users/{userId}/playlists
      description: Get all playlists for a specific user.
      tags:
        - Playlist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the user.
      responses:
        "200":
          description: An array of playlists.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Playlist"
        "401":
          description: Unauthorized.
        "404":
          description: User not found.

  /users/{userId}/playlist/{playlistId}:
    get:
      summary: /users/{userId}/playlist/{playlistId}
      description: Get a specific playlist by ID for a user.
      tags:
        - Playlist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the user.
        - in: path
          name: playlistId
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the playlist.
      responses:
        "200":
          description: The playlist object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "401":
          description: Unauthorized.
        "404":
          description: Playlist or User not found.

  /users/{userId}/playlists/{playlistId}:
    delete:
      summary: /users/{userId}/playlists/{playlistId}
      description: Delete a specific playlist by ID for a user.
      tags:
        - Playlist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the user.
        - in: path
          name: playlistId
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the playlist to delete.
      responses:
        "204":
          description: Playlist deleted successfully.
        "401":
          description: Unauthorized.
        "404":
          description: Playlist or User not found.

    patch:
      summary: /users/{userId}/playlists/{playlistId}
      description: Update a specific playlist by ID for a user.
      tags:
        - Playlist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the user.
        - in: path
          name: playlistId
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the playlist to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                image:
                  type: string
                visibility:
                  type: string
                  enum:
                    - PUBLIC
                    - PRIVATE
              example:
                name: My New Playlist Name
                image: http://example.com/new-image.png
                visibility: PUBLIC
      responses:
        "200":
          description: Playlist updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          description: Invalid update data.
        "401":
          description: Unauthorized.
        "404":
          description: Playlist or User not found.

  /users/playlist:
    post:
      summary: /users/playlist
      description: Create a new playlist.
      tags:
        - Playlist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                image:
                  type: string
              example:
                name: My Awesome Playlist
                image: http://example.com/image.png
      responses:
        "201":
          description: Playlist created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          description: Invalid input data.
        "401":
          description: Unauthorized.

components:
  schemas:
    Playlist:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        userId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        name: "My Playlist"
        description: "A cool playlist"
        userId: "f1e2d3c4-b5a6-9876-5432-10fedcba9876"
        createdAt: "2023-01-01T12:00:00Z"
        updatedAt: "2023-01-01T12:00:00Z"
