paths:
  /user/{userId}/follow:
    post:
      summary: Follow a user
      description: Follow a user by their UUID.
      tags:
        - Follow
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
          description: The user's UUID to follow.
      responses:
        '200':
          description: User followed successfully.
        '401':
          description: Unauthorized.
        '404':
          description: User not found.

  /user/{userId}/unfollow:
    post:
      summary: Unfollow a user
      description: Unfollow a user by their UUID.
      tags:
        - Follow
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
          description: The user's UUID to unfollow.
      responses:
        '200':
          description: User unfollowed successfully.
        '401':
          description: Unauthorized.
        '404':
          description: User not found.

  /user/{userId}/followers:
    get:
      summary: Get user's followers
      description: Get the followers of a user by their UUID.
      tags:
        - Follow
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
          description: The user's UUID.
        - in: query
          name: page
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
          description: Page number for pagination.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 10
          description: Number of items per page for pagination. Max 20 for regular users, 100 for admins.
      responses:
        '200':
          description: List of followers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  message:
                    type: string
                    example: "Followers fetched successfully"
        '404':
          description: User not found.

  /user/{userId}/following:
    get:
      summary: Get users a user is following
      description: Get the users that a user is following by their UUID.
      tags:
        - Follow
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
          description: The user's UUID.
        - in: query
          name: page
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
          description: Page number for pagination.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 10
          description: Number of items per page for pagination. Max 20 for regular users, 100 for admins.
      responses:
        '200':
          description: List of users being followed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  message:
                    type: string
                    example: "Following fetched successfully"
        '404':
          description: User not found.

components:
  schemas:
    User: # Assuming User schema is defined elsewhere or this is a placeholder
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
      example:
        id: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        name: "John Doe"
        email: "johndoe@example.com"
